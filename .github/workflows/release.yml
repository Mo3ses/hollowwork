name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/Hollowwork.App/Hollowwork.App.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:Version="$version" \
            -o "out/${{ matrix.rid }}"

      - name: Package (linux)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -czf "Hollowwork-$version-linux-x64.tar.gz" -C "out/linux-x64" .

      - name: Package (windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          Compress-Archive -Path 'out/win-x64/*' -DestinationPath "Hollowwork-$version-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Hollowwork-${{ matrix.rid }}
          path: Hollowwork-*
          if-no-files-found: error

  release:
    name: publish release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Hollowwork $version" \
            --generate-notes

      - name: Checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
