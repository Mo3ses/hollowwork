name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            echo "version is empty" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/Hollowwork.App/Hollowwork.App.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:Version="$VERSION" \
            -o "out/${{ matrix.rid }}"

      - name: Package (linux)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          tar -czf "Hollowwork-$VERSION-linux-x64.tar.gz" -C "out/linux-x64" .

      - name: Package (windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          Compress-Archive -Path 'out/win-x64/*' -DestinationPath "Hollowwork-$env:VERSION-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Hollowwork-${{ matrix.rid }}
          path: Hollowwork-*
          if-no-files-found: error

  release:
    name: open draft release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Open draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Publishing is manual: this only creates a draft. A dispatched run also
          # creates the tag when the draft is published.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Hollowwork $VERSION" \
              --target main \
              --draft \
              --generate-notes
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Hollowwork $VERSION" \
              --draft \
              --generate-notes
          fi
